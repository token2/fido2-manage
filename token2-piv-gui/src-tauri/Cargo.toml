[package]
name = "token2-piv-gui"
version = "0.1.0"
description = "Token2 Key Manager"
authors = ["Token2"]
edition = "2021"


[lib]
name = "token2_keymanager"
path = "src/lib.rs"

[[bin]]
name = "token2-key-manager"
path = "src/main.rs"

[[bin]]
name = "fido2-manage"
path = "src/bin/fido2-manage.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hidapi = "2"
rfd = "0.15"
rsa = "0.9"
spki = { version = "0.7", features = ["std"] }
der = { version = "0.7", features = ["std", "oid"] }
pem = "3"
x509-parser = { version = "0.16", features = ["verify"] }
sha2 = "0.10"
rcgen = "0.13"
time = "0.3"
pcsc = "2"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base32 = "0.5"
rand = "0.8"
url = "2"
rqrr = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
p256 = { version = "0.13", features = ["ecdh"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sec1 = { version = "0.7", features = ["der", "std"] }

[profile.dev]
incremental = true
opt-level = 0
debug = 1
codegen-units = 256

# fast iteration builds: optimized enough to run, but quick to compile
[profile.dev.package."*"]
opt-level = 1        # deps compiled once with light optimization

[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading"] }
