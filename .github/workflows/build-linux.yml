name: Build Linux

on:
  workflow_dispatch:   # manual only — run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev pcscd libssl-dev pkg-config cmake build-essential libudev-dev \
            libcbor-dev zlib1g-dev check \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          # FUSE for appimagetool (package name differs across Ubuntu versions)
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true
          sudo apt-get install -y fuse || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: token2-piv-gui/src-tauri

      - name: Build libt2piv + GUI
        run: |
          set -e
          cmake -S token2-piv-tool -B /tmp/t2build -DCMAKE_BUILD_TYPE=Release -DGENERATE_MAN_PAGES=OFF
          cmake --build /tmp/t2build --target t2piv_shared -j"$(nproc)"
          # build the PIV CLI tools as well (portable binaries)
          cmake --build /tmp/t2build -j"$(nproc)" || true
          rm -rf /tmp/libfido2
          git clone --depth 1 --branch 1.15.0 https://github.com/Yubico/libfido2 /tmp/libfido2
          ( cd /tmp/libfido2 && git apply --ignore-whitespace "$GITHUB_WORKSPACE/libfido2-token2.patch" )
          # fail loudly if the patch did not land the function or the export
          grep -q fido_dev_token2_apdu /tmp/libfido2/src/dev.c || { echo "ERROR: token2_apdu not in dev.c"; exit 1; }
          # STATIC build: no runtime .so, so a system libfido2 can never shadow it
          cmake -S /tmp/libfido2 -B /tmp/libfido2/build -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF -DUSE_PCSC=ON -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF 2>&1 | tee /tmp/fido_cmake.log; grep -i "zlib\|compress" /tmp/fido_cmake.log || true
          cmake --build /tmp/libfido2/build --target fido2 -j"$(nproc)"
          nm /tmp/libfido2/build/src/libfido2.a | grep -q fido_dev_token2_apdu || { echo "ERROR: symbol not in static lib"; exit 1; }
          export T2PIV_LIB_DIR=/tmp/t2build/lib FIDO2_LIB_DIR=/tmp/libfido2/build/src FIDO2_LINK_STATIC=1 FIDO2_LIB_NAME=fido2
          cd token2-piv-gui/src-tauri
          mkdir -p libs && touch libs/.keep   # satisfy tauri.conf resources glob
          RUSTFLAGS="-C link-arg=-Wl,-rpath,\$ORIGIN" cargo build --release --bin token2-key-manager --bin fido2-manage

      - name: Stage portable folder
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts/portable"
          # ship the binary under a friendly name
          cp token2-piv-gui/src-tauri/target/release/token2-key-manager "$RUNNER_TEMP/artifacts/portable/token2-key-manager" 2>/dev/null || true
          cp token2-piv-gui/src-tauri/target/release/fido2-manage "$RUNNER_TEMP/artifacts/portable/fido2-manage" 2>/dev/null || true
          chmod +x "$RUNNER_TEMP/artifacts/portable/token2-key-manager" "$RUNNER_TEMP/artifacts/portable/fido2-manage" 2>/dev/null || true
          cp /tmp/t2build/lib/libt2piv.so* "$RUNNER_TEMP/artifacts/portable/" 2>/dev/null || true
          # PIV CLI tools built by cmake (rename with the token2- prefix, like Windows)
          for f in /tmp/t2build/tool/yubico-piv-tool /tmp/t2build/tool/token2-piv-tool /tmp/t2build/tool/*piv-tool; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/artifacts/portable/token2-piv-tool" 2>/dev/null || true; done
          chmod +x "$RUNNER_TEMP/artifacts/portable/"* 2>/dev/null || true
          # libfido2 is statically linked into the binary — nothing to bundle for it.
          # Copy only libt2piv's own non-system deps (never libfido2).
          # bundle the GUI's non-system shared-lib dependencies (t2piv, fido2, cbor,
          # pcsclite, ssl, etc.) so the AppImage is self-contained for PC/SC too
          ldd token2-piv-gui/src-tauri/target/release/token2-key-manager \
            | awk '/=> \//{print $3}' \
            | grep -Ei "t2piv|fido2|cbor|pcsclite|crypto|ssl" \
            | xargs -r -I{} cp -L {} "$RUNNER_TEMP/artifacts/portable/" 2>/dev/null || true
          # also copy libpcsclite explicitly (it may be dlopen'd, not in ldd)
          for p in /usr/lib/*/libpcsclite.so.1 /usr/lib/libpcsclite.so.1; do [ -f "$p" ] && cp -L "$p" "$RUNNER_TEMP/artifacts/portable/" 2>/dev/null || true; done
          # launcher that guarantees the bundled libfido2 wins over any system copy
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'export LD_LIBRARY_PATH="$HERE:$LD_LIBRARY_PATH"' 'exec "$HERE/token2-key-manager" "$@"' > "$RUNNER_TEMP/artifacts/portable/run.sh"
          chmod +x "$RUNNER_TEMP/artifacts/portable/run.sh"
          ls -la "$RUNNER_TEMP/artifacts/portable" || true

      - name: Build AppImage
        run: |
          set -e
          APPDIR="$RUNNER_TEMP/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          # app payload: GUI + CLI tools + shared libs all together
          cp "$RUNNER_TEMP/artifacts/portable/"* "$APPDIR/usr/bin/" 2>/dev/null || true
          # move the shared libs into usr/lib (and keep a copy next to the bin for safety)
          cp "$RUNNER_TEMP/artifacts/portable/"*.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          chmod +x "$APPDIR/usr/bin/"* 2>/dev/null || true
          # ---- icon (AppImage needs it in several places) ----
          ICON=token2-piv-gui/src-tauri/icons/icon.png
          if [ -f "$ICON" ]; then
            cp "$ICON" "$APPDIR/token2-key-manager.png"                       # AppDir-root icon
            cp "$ICON" "$APPDIR/.DirIcon"                                     # icon of the .AppImage file itself
            install -Dm644 "$ICON" "$APPDIR/usr/share/icons/hicolor/256x256/apps/token2-key-manager.png"
          fi
          # ---- .desktop (both at AppDir root AND the standard path) ----
          mkdir -p "$APPDIR/usr/share/applications"
          cat > "$APPDIR/usr/share/applications/token2-key-manager.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Token2 Key Manager
          Comment=Manage FIDO2 security keys, with PIV and OTP
          Exec=token2-key-manager
          Icon=token2-key-manager
          Categories=Utility;Security;
          Terminal=false
          EOF
          cp "$APPDIR/usr/share/applications/token2-key-manager.desktop" "$APPDIR/token2-key-manager.desktop"
          # AppRun: set LD_LIBRARY_PATH so the GUI and CLIs find the bundled libs
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin:$LD_LIBRARY_PATH"
          # Multi-binary AppImage. Pick which bundled program to run:
          #  1) if invoked by a name matching a bundled tool (symlink the AppImage to
          #     "fido2-manage" or set ARGV0), run that tool;
          #  2) "--tool NAME [args]" runs that bundled tool explicitly;
          #  3) otherwise launch the GUI.
          base="$(basename "${ARGV0:-$0}")"
          if [ -x "$HERE/usr/bin/$base" ] && [ "$base" != "token2-key-manager" ] && [ "$base" != "AppRun" ]; then
            exec "$HERE/usr/bin/$base" "$@"
          fi
          if [ "$1" = "--tool" ] && [ -n "$2" ]; then tool="$2"; shift 2; exec "$HERE/usr/bin/$tool" "$@"; fi
          exec "$HERE/usr/bin/token2-key-manager" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          # fetch appimagetool; extract it so we don't need FUSE to RUN the tool itself
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ( cd /tmp && ./appimagetool --appimage-extract >/dev/null 2>&1 ) || true
          TOOL="/tmp/squashfs-root/AppRun"
          [ -x "$TOOL" ] || TOOL="/tmp/appimagetool"
          # build. ARCH is required; the output AppImage's own runtime still needs FUSE
          # on the END USER's machine, which is normal for AppImages.
          ARCH=x86_64 "$TOOL" "$APPDIR" "$RUNNER_TEMP/artifacts/Token2-Key-Manager-x86_64.AppImage" \
            || ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "$RUNNER_TEMP/artifacts/Token2-Key-Manager-x86_64.AppImage"
          ls -la "$RUNNER_TEMP/artifacts/" || true

      - name: Build .deb
        run: |
          set -e
          VER=0.1.0
          PKG="$RUNNER_TEMP/deb/token2-key-manager"
          rm -rf "$PKG"; mkdir -p "$PKG/DEBIAN" "$PKG/opt/token2-key-manager" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps"
          # payload: the whole portable folder (GUI + CLI tools + bundled .so)
          cp -r "$RUNNER_TEMP/artifacts/portable/." "$PKG/opt/token2-key-manager/"
          chmod +x "$PKG/opt/token2-key-manager/"* 2>/dev/null || true
          # launcher wrappers on PATH (set LD_LIBRARY_PATH to the install dir)
          cat > "$PKG/usr/bin/token2-key-manager" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH="/opt/token2-key-manager:$LD_LIBRARY_PATH"
          exec "/opt/token2-key-manager/token2-key-manager" "$@"
          EOF
          cat > "$PKG/usr/bin/fido2-manage" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH="/opt/token2-key-manager:$LD_LIBRARY_PATH"
          exec "/opt/token2-key-manager/fido2-manage" "$@"
          EOF
          chmod +x "$PKG/usr/bin/token2-key-manager" "$PKG/usr/bin/fido2-manage"
          # icon + desktop entry
          ICON=token2-piv-gui/src-tauri/icons/icon.png
          [ -f "$ICON" ] && cp "$ICON" "$PKG/usr/share/icons/hicolor/256x256/apps/token2-key-manager.png" || true
          cat > "$PKG/usr/share/applications/token2-key-manager.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Token2 Key Manager
          Comment=Manage FIDO2 security keys, with PIV and OTP
          Exec=token2-key-manager
          Icon=token2-key-manager
          Categories=Utility;Security;
          Terminal=false
          EOF
          # control file: declare runtime deps so apt pulls in PC/SC + webkit
          INSTALLED_KB=$(du -sk "$PKG/opt" | cut -f1)
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: token2-key-manager
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Token2 Sarl <info@token2.com>
          Homepage: https://www.token2.com
          Vcs-Browser: https://github.com/token2/librekeycompanion_desktop
          Vcs-Git: https://github.com/token2/librekeycompanion_desktop.git
          Installed-Size: $INSTALLED_KB
          Depends: pcscd, libpcsclite1, libccid, libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37, libgtk-3-0
          Description: Token2 Key Manager - fido2-manage GUI with PIV and OTP management
           A graphical front-end for fido2-manage: manage FIDO2 security keys
           (passkeys, PIN, fingerprints) with added PIV certificate and OATH-TOTP/HOTP
           management for Token2 PIN+ and FIDO2 keys and other CTAP2 / PIV devices.
           .
           The package also installs the command-line tools fido2-manage and
           token2-piv-tool. FIDO2 and PIV access requires the PC/SC daemon (pcscd),
           which is installed and enabled automatically.
           .
           Token2 Sarl is a Swiss manufacturer of FIDO2 / FIDO U2F hardware tokens and
           programmable TOTP devices. https://www.token2.com
          EOF
          # enable pcscd after install (FIDO2/PIV need it)
          cat > "$PKG/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            # pcscd is socket-activated on modern distros; enable BOTH the socket and
            # the service so an already-plugged card is reliably enumerated, and
            # restart so it rescans straight away (fixes a key being invisible right
            # after install until pcscd settles / the card is replugged).
            systemctl enable --now pcscd.socket 2>/dev/null || true
            systemctl enable pcscd.service 2>/dev/null || true
            systemctl restart pcscd 2>/dev/null || systemctl start pcscd 2>/dev/null || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then update-desktop-database -q 2>/dev/null || true; fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then gtk-update-icon-cache -q /usr/share/icons/hicolor 2>/dev/null || true; fi
          exit 0
          EOF
          chmod 0755 "$PKG/DEBIAN/postinst"
          # documentation (machine-readable copyright + changelog raise package quality
          # and are shown by software centers / checked by lintian)
          DOCDIR="$PKG/usr/share/doc/token2-key-manager"; mkdir -p "$DOCDIR"
          cat > "$DOCDIR/copyright" <<EOF
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: Token2 Key Manager
          Upstream-Contact: Token2 Sarl <info@token2.com>
          Source: https://github.com/token2/librekeycompanion_desktop

          Files: *
          Copyright: $(date +%Y) Token2 Sarl, Switzerland
          License: BSD-2-Clause
           Redistribution and use in source and binary forms, with or without
           modification, are permitted provided that the conditions of the
           2-clause BSD licence are met. Bundled open-source components (libfido2,
           yubico-piv-tool, OpenSSL, Tauri and others) retain their own licences,
           listed in the application's About page.
          EOF
          cat > "$DOCDIR/changelog.Debian" <<EOF
          token2-key-manager ($VER) stable; urgency=low

            * Token2 Key Manager release $VER.

           -- Token2 Sarl <info@token2.com>  $(date -R)
          EOF
          gzip -9n "$DOCDIR/changelog.Debian"
          chmod 0644 "$DOCDIR/copyright" "$DOCDIR/changelog.Debian.gz"
          dpkg-deb --build --root-owner-group "$PKG" "$RUNNER_TEMP/artifacts/token2-key-manager_${VER}_amd64.deb"
          ls -la "$RUNNER_TEMP/artifacts/" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token2-key-manager-linux
          path: ${{ runner.temp }}/artifacts/**
          if-no-files-found: warn
